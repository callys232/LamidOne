<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
  <title id="t">LAMID FINANCE — budget dashboard preview</title>
  <desc id="d">Illustrative dashboard preview: budget totals, cost categories and margin trend, with the arithmetic shown.</desc>
  <rect x="1" y="1" width="958" height="598" rx="18" fill="#FBF9F8" stroke="#E7E4E1" stroke-width="2"/>
  <rect x="1" y="1" width="958" height="52" rx="18" fill="#FFFFFF"/>
  <rect x="1" y="35" width="958" height="18" fill="#FFFFFF"/>
  <line x1="1" y1="53" x2="959" y2="53" stroke="#EFEDEA" stroke-width="1.5"/>
  <circle cx="30" cy="27" r="5" fill="#E7E4E1"/><circle cx="48" cy="27" r="5" fill="#E7E4E1"/><circle cx="66" cy="27" r="5" fill="#E7E4E1"/>
  <text x="92" y="32" font-family="system-ui,sans-serif" font-size="13" fill="#8A8A94">LAMID FINANCE — Budget dashboard</text>

  <g font-family="system-ui,sans-serif">
    <rect x="40" y="88" width="270" height="108" rx="12" fill="#B45309" fill-opacity=".08"/>
    <text x="64" y="146" font-size="36" fill="#B45309" font-weight="600">$284,600</text>
    <text x="64" y="176" font-size="13" fill="#5C5C66">Direct costs, this budget</text>

    <rect x="330" y="88" width="270" height="108" rx="12" fill="#B45309" fill-opacity=".05"/>
    <text x="354" y="146" font-size="36" fill="#16161A" font-weight="600">22.4%</text>
    <text x="354" y="176" font-size="13" fill="#5C5C66">Margin, current period</text>

    <rect x="620" y="88" width="300" height="108" rx="12" fill="#B45309" fill-opacity=".05"/>
    <text x="644" y="146" font-size="36" fill="#16161A" font-weight="600">4</text>
    <text x="644" y="176" font-size="13" fill="#5C5C66">Categories over budget</text>
  </g>

  <g font-family="system-ui,sans-serif">
    <rect x="40" y="228" width="420" height="342" rx="12" fill="#FFFFFF" stroke="#EFEDEA" stroke-width="1.5"/>
    <text x="64" y="260" font-size="13" fill="#5C5C66">Cost by category</text>
    <g font-size="12">
      <text x="64" y="298" fill="#16161A">Labour</text><text x="420" y="298" fill="#5C5C66" text-anchor="end">$142,300 · 50%</text>
      <rect x="64" y="308" width="376" height="8" rx="4" fill="#EFEDEA"/><rect x="64" y="308" width="188" height="8" rx="4" fill="#B45309"/>
      <text x="64" y="342" fill="#16161A">Materials</text><text x="420" y="342" fill="#5C5C66" text-anchor="end">$68,900 · 24%</text>
      <rect x="64" y="352" width="376" height="8" rx="4" fill="#EFEDEA"/><rect x="64" y="352" width="90" height="8" rx="4" fill="#B45309" fill-opacity=".8"/>
      <text x="64" y="386" fill="#16161A">Subcontract</text><text x="420" y="386" fill="#5C5C66" text-anchor="end">$44,100 · 15%</text>
      <rect x="64" y="396" width="376" height="8" rx="4" fill="#EFEDEA"/><rect x="64" y="396" width="56" height="8" rx="4" fill="#B45309" fill-opacity=".6"/>
      <text x="64" y="430" fill="#16161A">Overhead</text><text x="420" y="430" fill="#5C5C66" text-anchor="end">$29,300 · 11%</text>
      <rect x="64" y="440" width="376" height="8" rx="4" fill="#EFEDEA"/><rect x="64" y="440" width="42" height="8" rx="4" fill="#B45309" fill-opacity=".45"/>
    </g>
    <line x1="64" y1="480" x2="420" y2="480" stroke="#EFEDEA"/>
    <text x="64" y="510" font-size="12" fill="#8A8A94">TOTAL, LOADED</text>
    <text x="420" y="510" font-size="12" fill="#16161A" text-anchor="end" font-weight="600">$310,660</text>
  </g>

  <g font-family="system-ui,sans-serif">
    <rect x="480" y="228" width="440" height="342" rx="12" fill="#FFFFFF" stroke="#EFEDEA" stroke-width="1.5"/>
    <text x="504" y="260" font-size="13" fill="#5C5C66">Margin, six periods</text>
    <g stroke="#EFEDEA" stroke-width="1"><line x1="504" y1="320" x2="896" y2="320"/><line x1="504" y1="380" x2="896" y2="380"/><line x1="504" y1="440" x2="896" y2="440"/></g>
    <path d="M504 420 L560 400 L616 410 L672 360 L728 340 L784 320 L840 300" fill="none" stroke="#B45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="840" cy="300" r="5" fill="#FBF9F8" stroke="#B45309" stroke-width="3"/>
    <text x="504" y="520" font-size="12" fill="#8A8A94">Q1</text><text x="600" y="520" font-size="12" fill="#8A8A94">Q2</text><text x="700" y="520" font-size="12" fill="#8A8A94">Q3</text><text x="820" y="520" font-size="12" fill="#8A8A94">Q4</text>
  </g>
