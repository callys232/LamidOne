<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
  <title id="t">LAMID CORE — operating dashboard preview</title>
  <desc id="d">Illustrative dashboard preview: health score, open decisions and drift alerts, with a rising cadence trend line.</desc>
  <defs>
    <linearGradient id="core-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E4FD8" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#1E4FD8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="958" height="598" rx="18" fill="#FBF9F8" stroke="#E7E4E1" stroke-width="2"/>
  <rect x="1" y="1" width="958" height="52" rx="18" fill="#FFFFFF"/>
  <rect x="1" y="35" width="958" height="18" fill="#FFFFFF"/>
  <line x1="1" y1="53" x2="959" y2="53" stroke="#EFEDEA" stroke-width="1.5"/>
  <circle cx="30" cy="27" r="5" fill="#E7E4E1"/><circle cx="48" cy="27" r="5" fill="#E7E4E1"/><circle cx="66" cy="27" r="5" fill="#E7E4E1"/>
  <text x="92" y="32" font-family="system-ui,sans-serif" font-size="13" fill="#8A8A94">LAMID CORE — Operating dashboard</text>

  <!-- stat tiles -->
  <g font-family="system-ui,sans-serif">
    <rect x="40" y="88" width="270" height="108" rx="12" fill="#1E4FD8" fill-opacity=".07"/>
    <text x="64" y="150" font-size="44" fill="#1E4FD8" font-weight="600">83</text>
    <text x="64" y="176" font-size="13" fill="#5C5C66">Health score</text>

    <rect x="330" y="88" width="270" height="108" rx="12" fill="#1E4FD8" fill-opacity=".05"/>
    <text x="354" y="150" font-size="44" fill="#16161A" font-weight="600">12</text>
    <text x="354" y="176" font-size="13" fill="#5C5C66">Open decisions</text>

    <rect x="620" y="88" width="300" height="108" rx="12" fill="#1E4FD8" fill-opacity=".05"/>
    <text x="644" y="150" font-size="44" fill="#16161A" font-weight="600">4</text>
    <text x="644" y="176" font-size="13" fill="#5C5C66">Cadence drift alerts</text>
  </g>

  <!-- trend chart -->
  <g>
    <rect x="40" y="228" width="880" height="220" rx="12" fill="#FFFFFF" stroke="#EFEDEA" stroke-width="1.5"/>
    <text x="64" y="260" font-family="system-ui,sans-serif" font-size="13" fill="#5C5C66">Decision clarity — evidence-adjusted index</text>
    <g stroke="#EFEDEA" stroke-width="1">
      <line x1="64" y1="300" x2="856" y2="300"/><line x1="64" y1="350" x2="856" y2="350"/><line x1="64" y1="400" x2="856" y2="400"/>
    </g>
    <path d="M64 400 L204 370 L344 380 L484 320 L624 300 L764 280 L856 260 L856 420 L64 420 Z" fill="url(#core-area)"/>
    <path d="M64 400 L204 370 L344 380 L484 320 L624 300 L764 280 L856 260" fill="none" stroke="#1E4FD8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="856" cy="260" r="5" fill="#FBF9F8" stroke="#1E4FD8" stroke-width="3"/>
  </g>

  <!-- decision rows -->
  <g font-family="system-ui,sans-serif" font-size="13">
    <rect x="40" y="470" width="880" height="100" rx="12" fill="#FFFFFF" stroke="#EFEDEA" stroke-width="1.5"/>
    <text x="64" y="496" fill="#8A8A94" font-size="11">DECISION</text><text x="480" y="496" fill="#8A8A94" font-size="11">STAGE</text><text x="680" y="496" fill="#8A8A94" font-size="11">OWNER</text>
    <line x1="64" y1="508" x2="856" y2="508" stroke="#EFEDEA"/>
    <text x="64" y="532" fill="#16161A">Vendor consolidation — EU region</text><text x="480" y="532" fill="#1E4FD8">In review</text><text x="680" y="532" fill="#5C5C66">Ops lead</text>
    <text x="64" y="556" fill="#16161A">Q3 pricing authority threshold</text><text x="480" y="556" fill="#B45309">Drifting</text><text x="680" y="556" fill="#5C5C66">Finance</text>
  </g>
</svg>
