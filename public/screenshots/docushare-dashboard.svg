    <text x="460" y="302" fill="#5C5C66">Client + 2 experts</text><text x="660" y="302" fill="#5C5C66">v3</text><text x="800" y="302" fill="#5C5C66">2 days ago</text>
    <line x1="64" y1="322" x2="856" y2="322" stroke="#F5F3F1"/>

