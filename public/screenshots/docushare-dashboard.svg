    <text x="460" y="402" fill="#5C5C66">Password-protected</text><text x="660" y="402" fill="#5C5C66">v2</text><text x="800" y="402" fill="#5C5C66">1 week ago</text>
    <line x1="64" y1="422" x2="856" y2="422" stroke="#F5F3F1"/>

    <text x="64" y="470" fill="#5C5C66">Link expiry, download limits and view analytics apply to every share.</text>
