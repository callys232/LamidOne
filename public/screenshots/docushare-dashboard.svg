    <line x1="64" y1="272" x2="856" y2="272" stroke="#EFEDEA"/>

    <g fill="#16161A">
      <rect x="64" y="286" width="18" height="22" rx="3" fill="#0F766E" fill-opacity=".18"/>
      <text x="92" y="302">Northwind — diagnostic report.pdf</text>
