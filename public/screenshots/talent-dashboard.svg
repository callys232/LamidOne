<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
  <title id="t">LAMID TALENT — capability dashboard preview</title>
  <desc id="d">Illustrative dashboard preview: capability index, bench strength, and dimension scores by team.</desc>
  <rect x="1" y="1" width="958" height="598" rx="18" fill="#FBF9F8" stroke="#E7E4E1" stroke-width="2"/>
  <rect x="1" y="1" width="958" height="52" rx="18" fill="#FFFFFF"/>
  <rect x="1" y="35" width="958" height="18" fill="#FFFFFF"/>
  <line x1="1" y1="53" x2="959" y2="53" stroke="#EFEDEA" stroke-width="1.5"/>
  <circle cx="30" cy="27" r="5" fill="#E7E4E1"/><circle cx="48" cy="27" r="5" fill="#E7E4E1"/><circle cx="66" cy="27" r="5" fill="#E7E4E1"/>
  <text x="92" y="32" font-family="system-ui,sans-serif" font-size="13" fill="#8A8A94">LAMID TALENT — Capability dashboard</text>

  <g font-family="system-ui,sans-serif">
    <rect x="40" y="88" width="270" height="108" rx="12" fill="#6D28D9" fill-opacity=".08"/>
    <text x="64" y="150" font-size="44" fill="#6D28D9" font-weight="600">72</text>
    <text x="64" y="176" font-size="13" fill="#5C5C66">Capability index</text>

    <rect x="330" y="88" width="270" height="108" rx="12" fill="#6D28D9" fill-opacity=".05"/>
    <text x="354" y="150" font-size="44" fill="#16161A" font-weight="600">3</text>
    <text x="354" y="176" font-size="13" fill="#5C5C66">Roles with no successor</text>

    <rect x="620" y="88" width="300" height="108" rx="12" fill="#6D28D9" fill-opacity=".05"/>
    <text x="644" y="150" font-size="44" fill="#16161A" font-weight="600">2</text>
    <text x="644" y="176" font-size="13" fill="#5C5C66">Teams at load risk</text>
  </g>

  <g font-family="system-ui,sans-serif">
    <rect x="40" y="228" width="880" height="220" rx="12" fill="#FFFFFF" stroke="#EFEDEA" stroke-width="1.5"/>
    <text x="64" y="260" font-size="13" fill="#5C5C66">Capability by dimension, evidence-adjusted</text>
    <!-- horizontal bars -->
    <g font-size="12" fill="#5C5C66">
      <text x="64" y="296">Decision quality</text>
      <rect x="240" y="284" width="560" height="14" rx="7" fill="#EFEDEA"/>
      <rect x="240" y="284" width="470" height="14" rx="7" fill="#6D28D9"/>

      <text x="64" y="330">Cadence discipline</text>
      <rect x="240" y="318" width="560" height="14" rx="7" fill="#EFEDEA"/>
      <rect x="240" y="318" width="330" height="14" rx="7" fill="#6D28D9" fill-opacity=".85"/>

      <text x="64" y="364">Succession depth</text>
      <rect x="240" y="352" width="560" height="14" rx="7" fill="#EFEDEA"/>
      <rect x="240" y="352" width="210" height="14" rx="7" fill="#6D28D9" fill-opacity=".7"/>

      <text x="64" y="398">Engagement signal</text>
      <rect x="240" y="386" width="560" height="14" rx="7" fill="#EFEDEA"/>
      <rect x="240" y="386" width="500" height="14" rx="7" fill="#6D28D9" fill-opacity=".9"/>
    </g>
  </g>

  <g font-family="system-ui,sans-serif" font-size="13">
    <rect x="40" y="470" width="880" height="100" rx="12" fill="#FFFFFF" stroke="#EFEDEA" stroke-width="1.5"/>
    <text x="64" y="496" fill="#8A8A94" font-size="11">ROLE</text><text x="480" y="496" fill="#8A8A94" font-size="11">BENCH</text><text x="680" y="496" fill="#8A8A94" font-size="11">RISK</text>
    <line x1="64" y1="508" x2="856" y2="508" stroke="#EFEDEA"/>
    <text x="64" y="532" fill="#16161A">Head of Delivery, EMEA</text><text x="480" y="532" fill="#5C5C66">None ready</text><text x="680" y="532" fill="#B91C1C">High</text>
    <text x="64" y="556" fill="#16161A">Principal Engineer</text><text x="480" y="556" fill="#5C5C66">1 ready</text><text x="680" y="556" fill="#B45309">Medium</text>
  </g>
